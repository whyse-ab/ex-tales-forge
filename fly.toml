# Fly.io deployment for Tales Forge
app = "tales-forge"
primary_region = "arn"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "tales-forge.fly.dev"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"
  cpus = 1
