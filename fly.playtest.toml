# Fly.io config for the long-lived PLAYTEST environment of Tales Forge.
# Derived from fly.toml (production); keep the two in sync apart from the
# app name, PHX_HOST, VM memory and swap.
#
# Deploy (main -> playtest):
#   flyctl deploy --remote-only --depot=false -c fly.playtest.toml -a tales-forge-playtest --ha=false
# or run the "Deploy to playtest" GitHub Actions workflow by hand
# (`playtest.yml`; no longer automatic after CI — hobby mode,
# docs/hobby-mode.md step 1). Admin and security merges go straight to
# production through deploy-lanes.yml; a normal merge waits for
# "Deploy to production".
#
# Database: Fly Postgres app tales-forge-playtest-db (attached, sets DATABASE_URL).
app = "tales-forge-playtest"
primary_region = "arn"
# 512MB is tight for the BEAM at boot (OOM-killed without swap); swap on the
# rootfs costs nothing extra and keeps the VM at the cheap 512MB size.
swap_size_mb = 512
# Fly sends SIGTERM and waits 30s before it kills the machine, so the code
# heat sampler can write its last sample (same as fly.toml).
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "tales-forge-playtest.fly.dev"
  PORT = "4000"
  # Fly private networking (.internal / .flycast) is IPv6-only
  ECTO_IPV6 = "true"
  # World features read when a session is created (ex-tales-forge
  # docs/design-tin-valley-world.md); off on production (fly.toml).
  INN_WORLD = "on"
  WORLD_ANTAGONIST = "on"
  # Hourly call-time sample for /admin/operate/code-heat (TalesForge.CodeHeat).
  # Playtest only: production stays off.
  CODE_HEAT_MAP = "on"
  # Opposed combat rolls and NPC wounds (TalesForge.Game.Combat). Playtest
  # only: production stays off (fly.toml) until Gentry passes it.
  COMBAT_OPPOSED = "on"
  # Premise check first (docs/design-turn-pipeline.md §PR 2): a claim the
  # state contradicts ("the silver key Brenna gave me" with no key) blocks the
  # action instead of playing it as an everyday action. Gentry QA 2026-10-21,
  # session b01271a7 turn 10. Production stays off (fly.toml).
  TURN_PREMISE_FIRST = "on"
  # Locations step 1 (docs/design-locations.md): the GM prompt says what the
  # character sees on its place's grid (Valley Inn ground floor). Playtest
  # only: production stays off (fly.toml).
  LOCATION_GRID = "on"
  # Character memory in shadow mode (board card fc3c9371): scene-end rows are
  # written, the recall is built, the GM prompt stays the same. Production
  # stays off (fly.toml).
  CHARACTER_MEMORY = "shadow"
  # GM narration pacing (docs/design-gm-streaming.md): the "GM thinking" pause
  # before the streamed text and the slowest reveal speed. Playtest sets them
  # so Fredrik can try 1000, 1500 and 2000; production uses the defaults.
  GM_MIN_DELAY_MS = "1500"
  GM_REVEAL_MIN_MS_PER_CHAR = "8"
  # Self-check (card 1, #587/#588): Jev reads self_check, pure asks narrate with 0 ticks. Production also turns it on (fly.toml, #592).
  JEV_SELF_CHECK = "on"

[http_service]
  internal_port = 4000
  force_https = true
  # Always on: one machine is kept running for playtesters.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    # Public health endpoint; every other path needs a GitHub team sign-in.
    path = "/health"
    # force_ssl would 301 the plain-HTTP internal check; mark it as already HTTPS
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512"
  cpus = 1
